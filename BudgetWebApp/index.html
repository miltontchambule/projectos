<!DOCTYPE html>

<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Orçamento</title>
    <link rel="stylesheet" href="style.css">

</head>


<body>

    <div class="container">
    <button class="theme-toggle" onclick="toggleTheme()"></button>

        <div class="header">
            <h1>Gestor de Orçamento</h1>
            <div class="budget-display">
                <h2>ORÇAMENTO RESTANTE</h2>
                <div class="amount" id="remainingBudget">MT 0,00</div>
            </div>
        </div>


    <div class="tabs">
        <div class="tab active" onclick="showTab('budget')">Orçamento</div>
        <div class="tab" onclick="showTab('stats')">Estatísticas</div>
    </div>

    <div id="budgetTab" class="tab-content active">
        <div class="input-section">
            <div class="input-group">
                <label>Orçamento Mensal Total</label>
                <input type="number" id="totalBudget" placeholder="Ex: 1000" step="0.01">
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="setBudgetBtn" onclick="setBudget()" style="flex: 1;">Definir Orçamento</button>
                    <button class="btn btn-primary" id="addBudgetBtn" onclick="addToBudget()" style="flex: 1; display: none;">Adicionar ao Orçamento</button>
                </div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-group">
                <label>Produto/Serviço</label>
                <input type="text" id="expenseName" placeholder="Ex: Supermercado">
            </div>
            <div class="input-group">
                <label>Data do Gasto</label>
                <input type="date" id="expenseDate">
            </div>
            <div class="input-group">
                <label>Valor Gasto (MT)</label>
                <input type="number" id="expenseAmount" placeholder="Ex: 25.50" step="0.01">
                <button class="btn btn-primary" onclick="addExpense()">Adicionar Gasto</button>
            </div>
        </div>

        <div class="expenses-list" id="expensesList">
            <div class="no-data">Nenhum gasto registado ainda</div>
        </div>

        <button class="btn btn-danger" onclick="clearAllData()">Limpar Todos os Dados</button>
        <button class="btn btn-danger" onclick="resetApp()" style="margin-top: 5px;">Resetar App Completamente</button>
    </div>

    <div id="statsTab" class="tab-content">
        <div class="stats-section">
            <div class="stat-card">
                <h3>Total Gasto Este Mês</h3>
                <div class="value" id="totalSpent">MT 0,00</div>
            </div>
            <div class="stat-card">
                <h3>Gasto Médio por Compra</h3>
                <div class="value" id="averageSpend">MT 0,00</div>
            </div>
            <div class="stat-card">
                <h3>Número de Compras</h3>
                <div class="value" id="totalPurchases">0</div>
            </div>
        </div>

        <div class="chart-container">
            <canvas id="spendingChart"></canvas>
        </div>

        <div id="prediction" class="prediction-alert" style="display: none;">
            <h4>Previsão de Orçamento</h4>
            <p id="predictionText"></p>
        </div>
    </div>
<br>
<footer>
        <small>Desenvolvido por Milton Tchambule</small>
</footer>

</div>

  <script src="script.js"></script>


  
</body>
</html>
