<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão para Fofucha</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="corpo">

<div class="container">

    <h2 class="titulo">Quero Uma Cena Real Contigo!</h2>

    <div class="envelope">
        <div class="tampa" id="tampa"></div>

        <div class="carta" id="carta">
            <div class="texto" id="texto">
                Olá, Fofucha ❤️<br><br>
                Acreditas no Pai Natal?...<br><br>
                <small>Toca para o próximo cartão</small>
            </div>
        </div>
    </div>

    <div class="botoes">
        <button class="botao" onclick="abrir()">Abrir</button>
        <button class="botao" onclick="fechar()">Fechar</button>
    </div>

</div>
<style>

/* Corpo */
.corpo{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f8b4c4,#f6d0c0);
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

/* Container */
.container{
    text-align:center;
    position:relative;
}

/* Título */
.titulo{
    color:#b3003c;
    margin-bottom:30px;
}

/* Envelope */
.envelope{
    width:300px;
    height:200px;
    background:#ff4d89;
    position:relative;
    margin:auto;
    border-radius:8px;
    box-shadow:0px 0px 20px rgba(0,0,0,0.2);
    overflow:hidden;
}

/* Tampa */
.tampa{
    width:0;
    height:0;
    border-left:150px solid transparent;
    border-right:150px solid transparent;
    border-top:120px solid #7e081f;
    position:absolute;
    top:0;
    left:0;
    transform-origin:top;
    transition:0.8s;
    z-index:3;
}

/* Carta */
.carta{
    width:260px;
    height:140px;
    background:white;
    position:absolute;
    left:20px;
    bottom:-170px;
    border-radius:10px;
    padding:20px;
    box-sizing:border-box;
    transition:1s;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    z-index:2;
}

/* Texto */
.texto{
    font-size:14px;
    color:#333;
}

/* Botões */
.botoes{
    margin-top:25px;
}

.botao{
    padding:10px 25px;
    margin:10px;
    border:2px solid #ff1744;
    background:#ff1744;
    color:white;
    cursor:pointer;
    border-radius:6px;
    transition:0.3s;
}

.botao:hover{
    background:white;
    color:#ff1744;
}

/* Formulário */
.formulario{
    margin-top:15px;
}

.botao-form{
    padding:8px 15px;
    margin:8px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#ff1744;
    color:white;
    font-weight:bold;
    transition:0.3s;
    position:relative;
}

/* Corações */
.coracao{
    position:absolute;
    color:red;
    font-size:20px;
    animation:flutuar 4s linear infinite;
}

@keyframes flutuar{
    0%{transform:translateY(0) scale(1); opacity:1;}
    100%{transform:translateY(-400px) scale(1.5); opacity:0;}
}

/* Mensagem final */
.mensagem-final{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%) scale(0);
    font-size:60px;
    font-weight:bold;
    color:white;
    text-shadow:0 0 20px #ff1744,0 0 40px #ff1744;
    transition:0.6s ease;
    z-index:999;
}

.nome-brilho{
    font-size:70px;
    font-weight:bold;
    background:linear-gradient(90deg,#fff,#ff1744,#fff);
    background-size:200% auto;
    color:transparent;
    -webkit-background-clip:text;
    background-clip:text;
    animation:brilho 2s linear infinite;
}

@keyframes brilho{
    0%{background-position:0%;}
    100%{background-position:200%;}
}

</style>

<script>

let indice = 0;

let mensagens = [
"Olá meu amorcito ❤️<br><br>Fiz estes cartões para ti...",
"Dizer-te olá foi e sempre será uma das melhores decisões que já tomei!",
"Conversar e estar contigo faz-me bem à saúde e à mente.",
"Todos os dias contigo são fantásticos e espero que sempre nos sintamos bem um ao lado do outro.",
"Com isto...",

];

const carta = document.getElementById("carta");
const texto = document.getElementById("texto");
const tampa = document.getElementById("tampa");

function abrir(){
    tampa.style.transform="rotateX(180deg)";
    carta.style.bottom="40px";
    criarCoracoes();
}

function fechar(){
    tampa.style.transform="rotateX(0deg)";
    carta.style.bottom="-170px";
}

carta.addEventListener("click", function(e){

    if(e.target.tagName === "BUTTON"){
        return;
    }

    if(indice < mensagens.length - 1){
        indice++;
        texto.innerHTML = mensagens[indice];

        if(indice === mensagens.length - 1){
            mostrarFormulario();
        }
    }
});

function mostrarFormulario(){

    texto.innerHTML = `
    Queres ser a minha Sweetie hoje e sempre (mesmo estando na balada em Bilene)? ❤️
    <div class="formulario">
        <button class="botao-form" id="sim">Não</button>
        <button class="botao-form" id="claro">Claro que sim</button>
    </div>
    `;

    const botaoSim = document.getElementById("sim");
    const botaoClaro = document.getElementById("claro");

    botaoSim.addEventListener("mouseover", function(){
        botaoSim.style.position="absolute";
        botaoSim.style.left=Math.random()*150+"px";
        botaoSim.style.top=Math.random()*80+"px";
    });

    botaoClaro.addEventListener("click", function(e){
        e.stopPropagation();
        respostaClaro();
    });
}

function respostaClaro(){

    for(let i=0;i<100;i++){
        let coracao = document.createElement("div");
        coracao.className="coracao";
        coracao.innerHTML="❤️";
        coracao.style.left=Math.random()*window.innerWidth+"px";
        coracao.style.bottom="0px";
        coracao.style.fontSize=(Math.random()*30+20)+"px";
        coracao.style.animationDuration=(Math.random()*3+2)+"s";
        document.body.appendChild(coracao);

        setTimeout(()=>{coracao.remove();},4000);
    }

    let mensagem = document.createElement("div");
    mensagem.className="mensagem-final";
    mensagem.innerHTML="TE AMO ❤️<br><span class='nome-brilho'>Lil Cíci ❤️</span>";
    document.body.appendChild(mensagem);

    setTimeout(()=>{
        mensagem.style.transform="translate(-50%,-50%) scale(1)";
    },100);
}

function criarCoracoes(){
    for(let i=0;i<15;i++){
        let coracao = document.createElement("div");
        coracao.className="coracao";
        coracao.innerHTML="❤️";
        coracao.style.left=Math.random()*300+"px";
        coracao.style.bottom="0px";
        coracao.style.fontSize=(Math.random()*20+15)+"px";
        document.querySelector(".container").appendChild(coracao);
        setTimeout(()=>{coracao.remove();},4000);
    }
}

</script>

</body>


</html>
